server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USER:tmdt}
    password: ${DB_PASSWORD:tmdt123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:tmdt}
    password: ${RABBITMQ_PASSWORD:tmdt123}
  jackson:
    default-property-inclusion: non_null

app:
  services:
    inventory-url: ${INVENTORY_URL:http://localhost:8084}
    catalog-url: ${CATALOG_URL:http://localhost:8083}
    identity-url: ${IDENTITY_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    vn.edu.tmdt: INFO
