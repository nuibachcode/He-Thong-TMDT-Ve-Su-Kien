server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: catalog-service
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${CATALOG_DB:catalog}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:tmdt}
    password: ${RABBITMQ_PASSWORD:tmdt123}
  jackson:
    default-property-inclusion: non_null

app:
  services:
    inventory-url: ${INVENTORY_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    vn.edu.tmdt: INFO
