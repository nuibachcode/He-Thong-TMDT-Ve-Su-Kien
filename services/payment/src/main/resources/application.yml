server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${DB_USER:tmdt}
    password: ${DB_PASSWORD:tmdt123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

app:
  services:
    order-url: ${ORDER_URL:http://localhost:8085}

payment:
  provider: ${PAYMENT_PROVIDER:mock}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    vn.edu.tmdt: INFO
